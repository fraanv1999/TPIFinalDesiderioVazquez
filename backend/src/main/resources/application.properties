spring.application.name=backend
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL. En Render, las variables salen de la base creada en render.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tpi_final}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Si la base está vacía, se ejecutan database/schema.sql y seed.sql al arrancar.
app.base.inicializar=${DB_INICIALIZAR:true}

# Orígenes del frontend, separados por coma
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
