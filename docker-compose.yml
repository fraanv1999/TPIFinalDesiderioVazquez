# Base de datos y backend en local, igual que en Render:
#   docker compose up --build
# La API queda en http://localhost:8080. El frontend se corre aparte con npm run dev.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tpi_final
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tpi_final"]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      CORS_ORIGENES: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:
